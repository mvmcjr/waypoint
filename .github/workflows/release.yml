name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Required to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary (Apple Silicon + Intel in one .dmg)
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

          # Linux — produces AppImage + .deb
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

          # Windows — produces MSI + NSIS installer
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cache Rust build artifacts across runs.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 on Linux requires WebKit2GTK 4.1 (not 4.0).
      # git2 vendored build needs cmake + pkg-config + OpenSSL headers.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            cmake

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── macOS code signing & notarization ─────────────────────────────
          # Export a Developer ID Application certificate as a .p12, base64-encode
          # it, and store the result in APPLE_CERTIFICATE. Leave all six secrets
          # unset to produce an unsigned build (useful for forks / CI testing).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # ── Windows code signing ───────────────────────────────────────────
          # Tauri 2 supports signing via a PFX file. Set these to enable it:
          #   TAURI_SIGNING_PRIVATE_KEY   – base64-encoded .pfx certificate
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD – password for the .pfx
          # (Tauri will skip signing automatically if the vars are absent.)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: Waypoint ${{ github.ref_name }}
          releaseBody: |
            See the assets below to download and install this version.

            **Platforms**
            - **macOS**: `.dmg` (universal — Apple Silicon + Intel)
            - **Linux**: `.AppImage` (portable) or `.deb` (Debian/Ubuntu)
            - **Windows**: `.msi` (recommended) or `.exe` (NSIS)
          releaseDraft: true
          # Tags containing a hyphen (e.g. v1.0.0-beta.1) are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
