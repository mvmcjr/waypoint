name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Required to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary (Apple Silicon + Intel in one .dmg)
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

          # Linux — produces AppImage + .deb
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

          # Windows — produces MSI + NSIS installer
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the changelog step below can diff against
          # the previous release tag (default checkout is a shallow, tag-less clone).
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)
          {
            echo "changelog<<CHANGELOG_EOF"
            if [ -n "$PREV_TAG" ]; then
              echo "**Changes since $PREV_TAG:**"
              echo ""
              git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "Initial release."
            fi
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cache Rust build artifacts across runs.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 on Linux requires WebKit2GTK 4.1 (not 4.0). OpenSSL and
      # libgit2 are built from source, so libssl-dev/cmake aren't strictly
      # required, but they're kept as a safety net for the vendored builds.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            cmake

      - run: pnpm install

      - name: Set app version from tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.REF_NAME.replace(/^v/, '');

            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');

            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]*\"/m, 'version = \"' + version + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            console.log('Version set to', version);
          "

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── macOS code signing & notarization ─────────────────────────────
          # Export a Developer ID Application certificate as a .p12, base64-encode
          # it, and store the result in APPLE_CERTIFICATE. Leave all six secrets
          # unset to produce an unsigned build (useful for forks / CI testing).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # ── Updater artifact signing ───────────────────────────────────────
          # Not Windows code signing: this is the minisign key Tauri uses to sign
          # updater bundles (generate with `pnpm tauri signer generate`). It only
          # matters once the updater plugin is configured; unset, it's skipped.
          # Windows Authenticode signing would go through bundle.windows
          # (certificateThumbprint or signCommand) in tauri.conf.json instead.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: Waypoint ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.changelog.outputs.changelog }}

            See the assets below to download and install this version.

            **Platforms**
            - **macOS**: `.dmg` (universal — Apple Silicon + Intel)
            - **Linux**: `.AppImage` (portable), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora/openSUSE)
            - **Windows**: `.msi` (recommended) or `.exe` (NSIS)
          releaseDraft: true
          # Tags containing a hyphen (e.g. v1.0.0-beta.1) are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}${{ matrix.platform == 'macos-latest' && !secrets.APPLE_CERTIFICATE && ' --no-sign' || '' }}
