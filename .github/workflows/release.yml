name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Required to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary (Apple Silicon + Intel in one .dmg)
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

          # Linux — produces AppImage + .deb
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

          # Windows — produces MSI + NSIS installer
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the changelog step below can diff against
          # the previous release tag (default checkout is a shallow, tag-less clone).
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)
          {
            echo "changelog<<CHANGELOG_EOF"
            if [ -n "$PREV_TAG" ]; then
              echo "**Changes since $PREV_TAG:**"
              echo ""
              git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "Initial release."
            fi
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Required when pinning by SHA: the action otherwise infers the
          # toolchain from the ref name.
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      # Cache Rust build artifacts across runs.
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 on Linux requires WebKit2GTK 4.1 (not 4.0). libgit2 is built
      # from source (cmake is a safety net for that vendored build). Nothing
      # links OpenSSL since git2 0.21 dropped its default https/ssh features;
      # libssl-dev stays until a release build confirms it can go.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            cmake

      - run: pnpm install

      - name: Set app version from tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$REF_NAME"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── macOS code signing & notarization ─────────────────────────────
          # Export a Developer ID Application certificate as a .p12, base64-encode
          # it, and store the result in APPLE_CERTIFICATE. Leave all six secrets
          # unset to produce an unsigned build (useful for forks / CI testing).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # ── Updater artifact signing ───────────────────────────────────────
          # Not Windows code signing: this is the minisign key Tauri uses to sign
          # updater bundles (generate with `pnpm tauri signer generate`). It only
          # matters once the updater plugin is configured; unset, it's skipped.
          # Windows Authenticode signing would go through bundle.windows
          # (certificateThumbprint or signCommand) in tauri.conf.json instead.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: Waypoint ${{ github.ref_name }}
          releaseBody: |
            ${{ steps.changelog.outputs.changelog }}

            See the assets below to download and install this version.

            **Platforms**
            - **macOS**: `.dmg` (universal — Apple Silicon + Intel)
            - **Linux**: `.AppImage` (portable), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora/openSUSE)
            - **Arch Linux**: `.pkg.tar.zst` (`sudo pacman -U waypoint-*.pkg.tar.zst`). Prefer it over the AppImage on Arch-based distros: it uses the system WebKitGTK
            - **Windows**: `.msi` (recommended) or `.exe` (NSIS)
          releaseDraft: true
          # Tags containing a hyphen (e.g. v1.0.0-beta.1) are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}${{ matrix.platform == 'macos-latest' && !secrets.APPLE_CERTIFICATE && ' --no-sign' || '' }}

  # Arch package, built against Arch's own WebKitGTK rather than Ubuntu 22.04's.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git nodejs pnpm rust cmake \
            gtk3 webkit2gtk-4.1 xdg-desktop-portal hicolor-icon-theme

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set app version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$REF_NAME"

      # makepkg refuses to run as root.
      - name: Build package
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder PKGDEST="$PWD/out" makepkg --noconfirm --nodeps

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          path: packaging/arch/out/*.pkg.tar.zst
          if-no-files-found: error

  # Separate from `arch` so the package is uploaded only after tauri-action
  # (the `build` jobs) has created the draft release. Runs even if one of those
  # platforms failed; any that succeeded created the release.
  arch-upload:
    needs: [build, arch]
    if: ${{ !cancelled() && needs.arch.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-package

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" ./*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" --clobber
