<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waypoint — Icon Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0e17;
      color: #b8c0d8;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 72px;
      padding: 80px 48px;
    }

    /* ── Header ── */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #2dd4bf;
      opacity: 0.65;
    }
    .subtitle {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #3a4260;
    }

    /* ── Size showcase ── */
    .sizes {
      display: flex;
      align-items: flex-end;
      gap: 0;
    }
    .size-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 0 40px;
    }
    .size-item + .size-item {
      border-left: 1px solid rgba(45, 212, 191, 0.08);
    }
    .size-item img {
      display: block;
    }
    .size-item img[width="32"] {
      image-rendering: crisp-edges;
    }
    .size-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #323852;
    }

    /* ── Context strip ── */
    .contexts {
      display: flex;
      align-items: flex-start;
      gap: 32px;
    }
    .ctx-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .ctx-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2d3250;
    }
    .ctx-swatch {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 14px;
    }
    .ctx-swatch.dark    { background: #0c0e17; border: 1px solid rgba(255,255,255,0.05); }
    .ctx-swatch.sidebar { background: #161922; border: 1px solid rgba(255,255,255,0.07); }
    .ctx-swatch.card    { background: #1b1f30; border: 1px solid rgba(255,255,255,0.08); }
    .ctx-swatch.light   { background: #eaecf4; }

    /* ── Divider ── */
    hr {
      border: none;
      border-top: 1px solid rgba(45, 212, 191, 0.07);
      width: 420px;
    }

    /* ── Color palette reference ── */
    .palette {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .swatch-name {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #2d3250;
    }
  </style>
</head>
<body>

  <header>
    <span class="brand">Waypoint</span>
    <span class="subtitle">App Icon Design Preview</span>
  </header>

  <!-- Three canonical sizes -->
  <div class="sizes">
    <div class="size-item">
      <img src="waypoint-icon.svg" width="32" height="32" alt="32px">
      <span class="size-label">32 px</span>
    </div>
    <div class="size-item">
      <img src="waypoint-icon.svg" width="128" height="128" alt="128px">
      <span class="size-label">128 px</span>
    </div>
    <div class="size-item">
      <img src="waypoint-icon.svg" width="512" height="512" alt="512px">
      <span class="size-label">512 px</span>
    </div>
  </div>

  <hr>

  <!-- Context backgrounds (64px) -->
  <div class="contexts">
    <div class="ctx-item">
      <span class="ctx-label">App dark</span>
      <div class="ctx-swatch dark">
        <img src="waypoint-icon.svg" width="64" height="64" alt="">
      </div>
    </div>
    <div class="ctx-item">
      <span class="ctx-label">Sidebar</span>
      <div class="ctx-swatch sidebar">
        <img src="waypoint-icon.svg" width="64" height="64" alt="">
      </div>
    </div>
    <div class="ctx-item">
      <span class="ctx-label">Card</span>
      <div class="ctx-swatch card">
        <img src="waypoint-icon.svg" width="64" height="64" alt="">
      </div>
    </div>
    <div class="ctx-item">
      <span class="ctx-label">Light bg</span>
      <div class="ctx-swatch light">
        <img src="waypoint-icon.svg" width="64" height="64" alt="">
      </div>
    </div>
  </div>

  <hr>

  <!-- Color palette reference -->
  <div class="palette">
    <div class="swatch">
      <div class="swatch-dot" style="background:#2dd4bf"></div>
      <span class="swatch-name">Teal</span>
    </div>
    <div class="swatch">
      <div class="swatch-dot" style="background:#818cf8"></div>
      <span class="swatch-name">Indigo</span>
    </div>
    <div class="swatch">
      <div class="swatch-dot" style="background:#a78bfa"></div>
      <span class="swatch-name">Violet</span>
    </div>
    <div class="swatch">
      <div class="swatch-dot" style="background:#181b28"></div>
      <span class="swatch-name">Dark</span>
    </div>
    <div class="swatch">
      <div class="swatch-dot" style="background:#0c0e17; border:1px solid rgba(255,255,255,0.1)"></div>
      <span class="swatch-name">BG</span>
    </div>
  </div>

</body>
</html>
